name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            nix:
              - '**/*.nix'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/actionlint.yaml'
            python:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/firmware.nix'
              - 'sync-python-deps.sh'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/actionlint.yaml'
              - 'src/**'
              - 'tests/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/actionlint.yaml'

  code-quality-nix:
    needs: filter
    if: needs.filter.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Check formatting (alejandra, statix, deadnix)
        run: nix fmt -- --ci .
      - name: Validate flake
        run: nix flake check --show-trace

  code-quality-python:
    needs: filter
    if: needs.filter.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run ruff linter
        run: uv run ruff check --no-fix
      - name: Run ruff formatter check
        run: uv run ruff format --check
      - name: Run ty type check
        run: uv run ty check
      - name: Run tests
        run: uv run pytest

  validate-nix-eval:
    needs: filter
    if: needs.filter.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Evaluate configuration (dry-run)
        run: nix build --accept-flake-config --dry-run

  workflow-smoke:
    needs: filter
    if: needs.filter.outputs.workflows == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Exercise the pins used by sync and release without calling their
      # write-capable jobs or the signing/upload composite action.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main
        with:
          diagnostic-endpoint: ""
      - name: Validate workflows
        run: nix run --inputs-from . nixpkgs#actionlint -- -color
      - name: Build a small derivation with the installed Nix and cache
        run: nix build --no-link --inputs-from . nixpkgs#hello --max-jobs 4 --cores 4
      - name: Build the SD image on the release runner without publishing
        if: runner.arch == 'ARM64'
        run: nix build .#sdImage --accept-flake-config --no-link --max-jobs 4 --cores 4
      - name: Verify dependency sync without pushing
        run: |
          ./sync-python-deps.sh
          nix develop --command uv lock
          git diff --exit-code -- pyproject.toml uv.lock

  ci:
    name: ci
    if: always()
    needs:
      - filter
      - code-quality-nix
      - code-quality-python
      - validate-nix-eval
      - workflow-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          NIX_RESULT: ${{ needs.code-quality-nix.result }}
          PYTHON_RESULT: ${{ needs.code-quality-python.result }}
          NIX_EVAL_RESULT: ${{ needs.validate-nix-eval.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-smoke.result }}
        run: |
          test "$FILTER_RESULT" = success
          for result in "$NIX_RESULT" "$PYTHON_RESULT" "$NIX_EVAL_RESULT" "$WORKFLOW_RESULT"; do
            test "$result" = success || test "$result" = skipped
          done
